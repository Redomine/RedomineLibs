title:
  ru: Именовать вложения
tooltip:
  ru: >-
    ФОП_Описание: текстовое имя открытого семейства, из которого запущена команда.
    ФОП_Описание типа: связь с первым текстовым параметром, имеющим непустое
    уникальное значение для каждого типа материнского семейства. Приоритет:
    ADSK_Марка, ADSK_Код изделия, ADSK_Наименование. Если такого параметра нет,
    ФОП_Описание типа остаётся пустым. У вложений внутри вложенных семейств
    оба параметра связываются с одноимёнными параметрами родительского семейства.
author: Redomine
