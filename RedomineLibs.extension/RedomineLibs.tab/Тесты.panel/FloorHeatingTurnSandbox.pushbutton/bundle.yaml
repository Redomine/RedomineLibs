title: Теплый пол
tooltip: Построение от двух свободных концов. Доступны улитка по и против часовой стрелки и змейка слева направо или справа налево; для змейки входящие трубы должны идти вертикально на виде. Можно задать предел поворотов, общую длину, отступ и шаг. Синие отброшенные линии по умолчанию скрыты; сохранение журнала можно отключить. Настройки сохраняются в профиле pyRevit.
author: Redomine
context: doc-project
