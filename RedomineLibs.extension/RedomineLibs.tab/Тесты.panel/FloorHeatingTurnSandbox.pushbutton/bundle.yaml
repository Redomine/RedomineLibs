title: Теплый пол
tooltip: Построение от двух свободных концов. Можно выбрать улитку или змейку (змейка пока не реализована), направление, предел поворотов, общую длину, отступ и шаг. Синие отброшенные линии по умолчанию скрыты; сохранение журнала можно отключить. Настройки сохраняются в профиле pyRevit.
author: Redomine
context: doc-project
