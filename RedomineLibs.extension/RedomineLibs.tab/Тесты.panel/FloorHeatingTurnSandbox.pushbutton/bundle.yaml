title: Улитка · песочница
tooltip: Диагностический обход от двух свободных концов. Позволяет задать направление, предел поворотов, отступ и шаг. Синие отброшенные линии по умолчанию скрыты; сохранение журнала можно отключить. Настройки сохраняются в профиле pyRevit.
