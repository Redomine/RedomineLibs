title: Теплый пол
tooltip: Построение от двух свободных концов для каждой выбранной залитой области. Можно предварительно выделить несколько областей или выбрать их после запуска команды. Доступны улитка и змейка в обоих направлениях; для змейки входящие трубы должны идти вертикально на виде. Можно задать предел поворотов, общую длину, отступ и шаг. Для каждой области сохраняется отдельный журнал; настройки сохраняются в профиле pyRevit.
author: Redomine
context: doc-project
