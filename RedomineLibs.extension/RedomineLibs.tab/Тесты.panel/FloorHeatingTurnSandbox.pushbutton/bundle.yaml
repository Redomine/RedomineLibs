title: Теплый пол
tooltip: Улитка строит трубы и соединяет их фитингами. Каждая ветвь берёт параметры и отметку своего подвода. Оба входа нового контура остаются свободными. Тестовые отрезки показываются линиями. Можно предварительно выделить несколько залитых областей или выбрать их после запуска. Если у улитки несколько возможных пар подводов, выделите область и две нужные трубы перед запуском. Для змейки входящие трубы должны идти вертикально на виде. Можно задать предел поворотов, общую длину, отступ и шаг. Для каждой области сохраняется отдельный журнал. Настройки сохраняются в профиле pyRevit.
author: Redomine
